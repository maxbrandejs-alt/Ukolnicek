<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Úkolníček</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: two-pane app — warm off-white sidebar with views + projects, centered single-column task list */
:root{
  --bg:#ffffff; --side:#fcfaf8; --surface:#ffffff; --hover:#f6f3f0; --active:#fbe9e6;
  --line:#ece8e4; --line-2:#e0dbd6;
  --fg:#202020; --fg-2:#5e5a57; --fg-3:#98928d;
  --accent:#DC4C3E; --accent-fg:#ffffff; --accent-soft:#fdeeec; --accent-text:#c53727;
  --p1:#D1453B; --p2:#EB8909; --p3:#246FE0; --p4:#8f8a85;
  --today:#058527; --tomorrow:#692EC2; --overdue:#D1453B; --week:#b46a00;
  --shadow:0 1px 2px rgba(40,25,15,.06),0 8px 28px rgba(40,25,15,.12);
  --backdrop:rgba(30,20,15,.35);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1f1f; --side:#262524; --surface:#2a2928; --hover:#323130; --active:#3d2a27;
  --line:#363433; --line-2:#44413f;
  --fg:#ececea; --fg-2:#b3afab; --fg-3:#807b77;
  --accent:#E5594B; --accent-fg:#ffffff; --accent-soft:#3b2724; --accent-text:#ff8a7e;
  --p1:#FF7066; --p2:#FF9A14; --p3:#5297FF; --p4:#8a8580;
  --today:#3cc164; --tomorrow:#ae7bff; --overdue:#ff7066; --week:#f0a53a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 32px rgba(0,0,0,.45);
  --backdrop:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1f1f1f; --side:#262524; --surface:#2a2928; --hover:#323130; --active:#3d2a27;
  --line:#363433; --line-2:#44413f;
  --fg:#ececea; --fg-2:#b3afab; --fg-3:#807b77;
  --accent:#E5594B; --accent-fg:#ffffff; --accent-soft:#3b2724; --accent-text:#ff8a7e;
  --p1:#FF7066; --p2:#FF9A14; --p3:#5297FF; --p4:#8a8580;
  --today:#3cc164; --tomorrow:#ae7bff; --overdue:#ff7066; --week:#f0a53a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 32px rgba(0,0,0,.45);
  --backdrop:rgba(0,0,0,.55); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%}
/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 10px 10px max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand-mark svg{width:16px;height:16px;stroke-width:2.6}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;color:var(--fg);text-align:left;width:100%;transition:background .12s}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--active);color:var(--accent-text);font-weight:500}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav-item.on .count{color:var(--accent-text)}
.nav-item.drop-hit{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ic-inbox{color:#246FE0}.ic-today{color:#058527}.ic-up{color:#692EC2}.ic-filter{color:#EB8909}.ic-done{color:var(--fg-3)}
:root[data-theme="dark"] .ic-inbox{color:#5297FF}
.side-scroll{overflow-y:auto;flex:1;min-height:0;margin-top:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;color:var(--fg-2);font-weight:600;font-size:13px}
.icon-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 4px}
.proj-item.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.proj-item.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.side-foot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;gap:4px;align-items:center}
.side-foot .nav-item{width:auto;flex:1;color:var(--fg-2)}
.kbd-hint{font-size:12px;color:var(--fg-3);padding:4px 8px 0}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg-2);background:var(--surface)}

/* Main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.topbar{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid transparent}
.menu-btn{display:none}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--hover);border:1px solid transparent;border-radius:8px;padding:0 10px;height:34px;color:var(--fg-3)}
.search:focus-within{background:var(--surface);border-color:var(--line-2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%;color:var(--fg)}
.add-btn{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:0 12px;height:34px;font-weight:600}
.add-btn:hover{filter:brightness(1.06)}
.content{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:780px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
.view-head h1{font-size:24px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance;display:flex;align-items:center;gap:6px}
.view-sub{color:var(--fg-3);font-size:13px;margin-top:4px}
.view-actions{margin-left:auto;display:flex;gap:4px}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;color:var(--fg-2);font-size:13px}
.ghost:hover{background:var(--hover);color:var(--fg)}
.ghost.danger:hover{color:var(--overdue)}
.note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--hover);border-radius:10px;padding:10px 14px;color:var(--fg-2);font-size:13px;margin-bottom:16px}
.note button{color:var(--accent-text);font-weight:600}

.group{margin-bottom:26px}
.group-head{display:flex;align-items:baseline;gap:8px;padding:0 0 8px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.group-head .gsub{color:var(--fg-3);font-weight:400;font-size:13px}
.group-head .ghost{margin-left:auto;padding:2px 8px;color:var(--accent-text);font-weight:500}
.group-head.overdue{color:var(--fg)}

.list{min-height:2px}
.list.drop-zone-hit{background:var(--accent-soft);border-radius:8px;min-height:40px}
.task{position:relative;display:flex;align-items:flex-start;gap:10px;padding:10px 6px 10px 4px;border-bottom:1px solid var(--line);background:var(--bg);transition:opacity .25s,max-height .26s ease,padding .26s ease}
.task:hover{background:linear-gradient(var(--bg),var(--bg))}
.grip{position:absolute;left:-22px;top:12px;width:18px;height:18px;color:var(--fg-3);opacity:0;cursor:grab;display:grid;place-items:center}
.task[draggable="true"]:hover .grip{opacity:.8}
.grip svg{width:14px;height:14px;fill:currentColor;stroke:none}
.task.dragging{opacity:.35}
.task.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.task.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.chev{position:absolute;left:-40px;top:12px;width:18px;height:18px;color:var(--fg-3);display:grid;place-items:center;border-radius:4px}
.chev:hover{background:var(--hover)}
.chev svg{width:14px;height:14px;transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.sublist{padding-left:30px}
.check{--pc:var(--p4);width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.6px solid var(--pc);background:color-mix(in srgb,var(--pc) 9%,transparent);display:grid;place-items:center;flex:none;color:var(--pc);transition:background .18s,transform .18s}
.check.p1{--pc:var(--p1);border-width:2px}.check.p2{--pc:var(--p2);border-width:2px}.check.p3{--pc:var(--p3);border-width:2px}
.check.p4{background:transparent}
.check svg{width:12px;height:12px;stroke-width:3;opacity:0;transition:opacity .15s}
.check:hover svg{opacity:.7}
.task.completing .check,.task.is-done .check{background:var(--pc);color:#fff;transform:scale(1.06)}
.task.completing .check svg,.task.is-done .check svg{opacity:1}
.task-body{flex:1;min-width:0;cursor:pointer}
.task-title{display:inline;color:var(--fg);background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.5px;transition:background-size .32s ease,color .3s;overflow-wrap:anywhere}
.task.completing .task-title{background-size:100% 1.5px;color:var(--fg-3)}
.task.is-done .task-title{color:var(--fg-3);text-decoration:line-through}
.task-desc{color:var(--fg-3);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:12px;color:var(--fg-3);align-items:center}
.task-meta:empty{display:none}
.task-meta span{display:inline-flex;align-items:center;gap:4px}
.task-meta svg.i{width:13px;height:13px}
.due.today{color:var(--today)}.due.tomorrow{color:var(--tomorrow)}.due.overdue{color:var(--overdue)}.due.week{color:var(--week)}
.lbl{color:var(--fg-2)}
.proj-badge{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:2px;white-space:nowrap;margin-top:2px;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.task.collapsing{max-height:0!important;padding-top:0;padding-bottom:0;opacity:0;overflow:hidden}

.add-row{display:flex;align-items:center;gap:10px;padding:10px 4px;color:var(--fg-3);width:100%;text-align:left}
.add-row .plus{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.add-row:hover{color:var(--accent-text)}
.add-row:hover .plus{background:var(--accent);color:#fff}
.empty{text-align:center;padding:48px 16px 24px;color:var(--fg-3)}
.empty-art{width:120px;height:90px;margin:0 auto 14px;display:block}
.empty h2{font-size:16px;color:var(--fg);margin:0 0 4px;font-weight:600}

.filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:28px}
.filter-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:left;background:var(--surface)}
.filter-card:hover{border-color:var(--line-2);background:var(--hover)}
.filter-card .count{margin-left:auto;color:var(--fg-3);font-size:12px;font-variant-numeric:tabular-nums}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2);background:var(--surface)}
.chip-btn:hover{border-color:var(--accent);color:var(--accent-text)}
.chip-btn .count{color:var(--fg-3);font-size:12px}
h3.sec{font-size:14px;margin:0 0 10px;font-weight:700}

/* Daily */
.check.daily-check{--pc:var(--today);border-radius:6px;border-width:2px}
.daily-bar{margin:10px 0 0}
.week-dots{display:inline-flex;gap:3px}
.week-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.week-dots i.on{background:var(--today)}
.streak{color:var(--week)}
.ic-daily{color:var(--today)}

/* Date picker */
.picker{position:fixed;z-index:70;width:292px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;animation:pop .14s ease}
.pk-quick{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.pk-quick button{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;text-align:left;font-size:13px}
.pk-quick button:hover{background:var(--hover)}
.pk-quick .when{margin-left:auto;color:var(--fg-3);font-size:12px}
.pk-quick .q-today svg{color:var(--today)}.pk-quick .q-tom svg{color:var(--tomorrow)}.pk-quick .q-next svg{color:var(--p3)}.pk-quick .q-none svg{color:var(--fg-3)}
.pk-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 4px}
.pk-head b{font-size:13px;font-weight:700}
.pk-head .icon-btn svg{width:16px;height:16px}
.pk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.pk-grid .wd{font-size:11px;color:var(--fg-3);padding:4px 0;font-weight:600}
.pk-grid button{height:34px;border-radius:50%;font-size:13px;font-variant-numeric:tabular-nums}
.pk-grid button:hover{background:var(--hover)}
.pk-grid button.out{color:var(--fg-3)}
.pk-grid button.past{color:var(--fg-3);opacity:.55}
.pk-grid button.today{color:var(--accent-text);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.pk-grid button.sel{background:var(--accent);color:var(--accent-fg);font-weight:700;opacity:1}
.tpicker{width:268px}
.tp-head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:4px 4px 8px}
.tp-row{display:flex;gap:6px}
.tp-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);font-size:15px;outline:none}
.tp-row input:focus{border-color:var(--line-2);box-shadow:0 0 0 3px var(--accent-soft)}
.tp-presets{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 6px}
.tp-presets button{padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;font-variant-numeric:tabular-nums}
.tp-presets button:hover{border-color:var(--accent);color:var(--accent-text)}
.tp-presets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tp-sub{font-size:11px;color:var(--fg-3);padding:4px 2px 0}
.tp-clear{width:100%;text-align:left;padding:8px 4px 4px;border-top:1px solid var(--line);margin-top:6px;color:var(--fg-2);font-size:13px;display:flex;gap:8px;align-items:center}
.tp-clear:hover{color:var(--fg)}
.date-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);text-align:left;width:100%;min-width:0;white-space:nowrap;overflow:hidden}
.date-btn:hover{border-color:var(--line-2)}
.date-btn.none{color:var(--fg-3)}
button.due{font-size:12px;display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 4px;margin:-1px -4px}
button.due:hover{background:var(--hover)}
.add-due{opacity:0;color:var(--fg-3);margin-top:-4px}
.task:hover .add-due,.add-due:focus-visible{opacity:1}
@media (hover:none){.add-due{opacity:.7}}
button.chip{cursor:pointer}
button.chip:hover{background:var(--hover)}

/* Daily log + stats */
:root{--heat1:#d3eedb;--heat2:#98d6aa;--heat3:#4fb36b;--heat4:#1d8640}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--heat1:#1f3a28;--heat2:#286a3c;--heat3:#3ea35c;--heat4:#72d98e}}
:root[data-theme="dark"]{--heat1:#1f3a28;--heat2:#286a3c;--heat3:#3ea35c;--heat4:#72d98e}
.tabs{display:inline-flex;gap:2px;background:var(--hover);border-radius:9px;padding:3px;margin:-6px 0 20px}
.tabs button{padding:6px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--fg-2)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:26px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);min-width:0}
.kpi .k{font-size:12px;color:var(--fg-3)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--fg-3);margin-top:2px}
.chart-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);margin-bottom:18px;min-width:0}
.chart-card h3{font-size:14px;margin:0 0 2px;font-weight:700}
.chart-card .cs{font-size:12px;color:var(--fg-3);margin-bottom:12px}
.chart-wrap{overflow-x:auto}
.bars svg{display:block;width:100%;min-width:480px;height:auto}
.bars text{fill:var(--fg-3);font-size:10px;font-family:var(--font)}
.bars .grid{stroke:var(--line);stroke-width:1}
.bars .bar{fill:var(--today)}
.bars .bar.today{fill:var(--heat3)}
.bars .hit{fill:transparent}
.bars .hit:hover+.bar,.bars g:hover .bar{opacity:.75}
.heat{display:flex;gap:6px}
.heat-days{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:10px;color:var(--fg-3);line-height:14px}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px}
.heat-grid i{border-radius:3px;background:var(--line)}
.heat-grid i.none{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat-grid i.l1{background:var(--heat1)}.heat-grid i.l2{background:var(--heat2)}.heat-grid i.l3{background:var(--heat3)}.heat-grid i.l4{background:var(--heat4)}
.heat-grid i.t{box-shadow:0 0 0 1.5px var(--fg)}
.heat-legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--fg-3);margin-top:10px}
.heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wd-bars{display:flex;flex-direction:column;gap:6px}
.wd-row{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px}
.wd-row .lbl2{color:var(--fg-2)}
.wd-row .track{height:10px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.wd-row .fill{height:100%;border-radius:0 4px 4px 0;background:var(--today)}
.wd-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.two-col .chart-card{margin-bottom:0}
.stat-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.stat-table th{text-align:left;font-size:11px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.stat-table td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat-table td.num,.stat-table th.num{text-align:right}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--fg);white-space:pre-line;max-width:240px}

  const canUndo = !!(undoSnap || onUndo);
  el.innerHTML = `<span>${esc(msg)}</span>${canUndo ? '<button class="undo">Zpět</button>' : ''}<button class="x" aria-label="Zavřít">${ic('x')}</button>`;
  box.appendChild(el);
  const kill = () => el.remove();
  el.querySelector('.x').onclick = kill;
  if (canUndo) el.querySelector('.undo').onclick = () => { if (undoSnap) restore(undoSnap); if (onUndo) onUndo(); kill(); toast('Vráceno zpět'); };

function saveQuickAdd() {
  const inp = $('#qa-title'); if (!inp) return;
  const ctx = JSON.parse(inp.dataset.ctx || '{}'); const r = parseQuick(inp.value);

function saveTask(close = true) {
  const box = $('.detail'); if (!box) return;
  const t = task(box.dataset.task); if (!t) return;
  const before = snap();
  const title = $('#d-title').value.trim(); if (!title) { $('#d-title').focus(); return; }
  t.title = title; t.desc = $('#d-desc').value.trim();
  t.due = $('#d-due').dataset.value || null; t.time = $('#d-time').value || null;
  if (t.time && !t.due) t.due = today();
  const pr = $('#d-prio .on'); t.priority = pr ? +pr.dataset.prio : 4;
  const np = $('#d-proj').value;
  if (np !== t.projectId) { t.projectId = np; if (t.parentId && task(t.parentId)?.projectId !== np) t.parentId = null; descendants(t.id).forEach(k => k.projectId = np); }
  t.labels = [...new Set($('#d-labels').value.split(',').map(s => s.trim().replace(/^@/, '')).filter(Boolean))];
  const rv = $('#d-recur').value;
  if (rv !== 'keep') {
    if (!rv) t.recur = null;
    else { if (!t.due) t.due = today(); t.recur = rv === 'd' ? { t: 'd', n: 1 } : rv === 'w' ? { t: 'w', days: [dow(t.due)] } : { t: rv }; }
  }
  t.remind = readRemind('d');
  if (t.remind != null && !t.due) t.due = today();
  t.snoozeUntil = null; markIfPast(t, t.due);
  if (close) { closeModal(); commit(); toast('Změny uloženy', before); } else save();
}

/* ---------- groups (shared through the artifact's database) ---------- */
const G = { status: 'loading', db: null, user: null, me: null, canWrite: true, groups: [], tasks: [], names: {}, avatars: {} };
const myGroups = () => G.groups.filter(g => (g.members || []).includes(G.me)).sort((a, b) => a.name.localeCompare(b.name, 'cs'));
const grp = id => G.groups.find(g => g.id === id);
const gtask = id => G.tasks.find(t => t.id === id);
async function initGroups() {
  const finish = s => { clearTimeout(timer); G.status = s; render(); };
  const timer = setTimeout(() => { if (G.status === 'loading') { G.status = 'slow'; render(); } }, 10000);
  if (!window.claude || typeof window.claude.use !== 'function') return finish('off');
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return finish('off');
    G.db = db; G.user = user; G.me = await user.id();
    if (!G.me) return finish('off');
    const c = await user.can('data.write'); G.canWrite = c !== false;
    let gOk = false, tOk = false;
    const mark = () => { if (gOk && tOk && G.status !== 'ready') finish('ready'); };
    db.collection('groups').onSnapshot(s => {
      G.groups = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!s.metadata.fromCache) gOk = true; mark(); render();
    }, () => finish('error'));
    db.collection('grouptasks').onSnapshot(s => {
      G.tasks = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!s.metadata.fromCache) tOk = true; mark(); render();
    }, () => finish('error'));
  } catch (e) { finish('off'); }
}
function personName(id) { if (!id) return ''; if (id === G.me) return 'Ty'; return G.names[id] || 'Člen skupiny'; }
function avHTML(id) { const src = G.avatars[id]; return src ? `<img class="av" src="${esc(src)}" alt="">` : `<span class="av"></span>`; }
async function resolveNames() {
  if (!G.user) return;
  const ids = new Set(); G.groups.forEach(g => (g.members || []).forEach(m => ids.add(m)));
  G.tasks.forEach(t => [t.assignee, t.createdBy, t.doneBy].forEach(x => x && ids.add(x)));
  const need = [...ids].filter(id => !(id in G.names)); if (!need.length) return;
  need.forEach(id => G.names[id] = '');
  try {
    const ps = await G.user.profiles(need);
    need.forEach(id => { G.names[id] = (ps[id] && ps[id].name) || ''; G.avatars[id] = (ps[id] && ps[id].avatarUrl) || ''; });
    render();
  } catch (e) {}
}

document.addEventListener('keydown', e => {
