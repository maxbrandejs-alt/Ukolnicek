{"name":"Sestavit aplikaci","on":{"push":{},"workflow_dispatch":{}},"jobs":{"apk":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Sestavit APK","run":"set +e\nfor z in *.zip; do if [ -f \"$z\" ]; then unzip -o -q \"$z\"; fi; done\nf=\"$(find . -name settings.gradle -not -path '*/build/*' | head -n 1)\"\nif [ -z \"$f\" ]; then echo \"::error title=Chybi projekt::V ulozisti neni projekt. Soubory: $(ls -A | tr '\\n' ' ')\"; exit 1; fi\ncd \"$(dirname \"$f\")\"\ngradle assembleDebug --no-daemon > \"$RUNNER_TEMP/log.txt\" 2>&1\ns=$?\ntail -n 120 \"$RUNNER_TEMP/log.txt\"\nif [ $s -ne 0 ]; then e=\"$(grep -E -A3 'What went wrong|error:|ERROR' \"$RUNNER_TEMP/log.txt\" | head -n 30 | sed 's/%/%25/g' | awk '{printf \"%s%%0A\", $0}')\"; echo \"::error title=Chyba sestaveni::$e\"; exit 1; fi\ncp app/build/outputs/apk/debug/app-debug.apk \"$GITHUB_WORKSPACE/Ukolnicek.apk\""},{"uses":"actions/upload-artifact@v4","with":{"name":"Ukolnicek-aplikace","path":"Ukolnicek.apk"}}]}}}
